name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: تنزيل مكونات Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: تنزيل Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip

      - name: إنشاء APK
        run: ./gradle-8.10.2/bin/gradle -p android-app assembleDebug

      - name: رفع APK للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: Mihad-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
